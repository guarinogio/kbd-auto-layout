name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src || true

      - name: Test
        run: pytest

  debian-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-pytest \
            build-essential lintian

      - name: Build package
        run: debuild -us -uc

      - name: Lintian check
        run: lintian --verbose ../kbd-auto-layout_*.changes || true
